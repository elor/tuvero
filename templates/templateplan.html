<div class="boxview templateplan noprint">
  <h3>Turnierablauf</h3>

  <div class="templatechoice">
    <p class="hint">
      Eine Vorlage spielt mehrere Phasen nacheinander: Vorrunden, ein
      Finale der Besten und eine Platzierungsrunde für alle anderen.
      Jede Phase wird ausgelost, sobald die vorige beendet ist.
    </p>
    <ul class="templatelist"></ul>
  </div>

  <div class="templateprogress">
    <h4 class="templatename"></h4>
    <p class="planoptions">
      <label>
        <span class="optionlabel"></span>
        <input type="number" class="planrounds" min="1" max="15" value="5" />
      </label>
      <label>
        <span class="optionlabel"></span>
        <select class="plankosize"></select>
      </label>
    </p>
    <ul class="planschedule"></ul>
    <ol class="templatesteps"></ol>
    <p class="planactions">
      <button class="planround">Runde starten</button>
      <button class="planstep"></button>
      <button class="cancelplan">Vorlage verwerfen</button>
    </p>
    <p class="stephint"></p>
  </div>
</div>
