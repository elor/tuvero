<div class="loginview">
  <img class="avatar userinfo" alt="avatar" src="" /> <span class="username userinfo">%% %%</span>

  <button class="logout big">logout</button>
  <button class="login big">login</button>
  <span class="busy spin" data-img="reload" title="Verbindung zum Server"></span>

  <p class="popupnotice">
    Popup-Blocker aktiv.
    <br>
    Melde dich auf <a href="https://www.tuvero.de/login"
                      target="_blank">https://www.tuvero.de</a> an und probiere es
    nochmal.
  </p>
  <p class="offline hidden">Kein Internet verfügbar.</p>
  <p class="errornotice">
    <span class="online">Server-Kommunikation fehlgeschlagen.</span>
  </p>
</div>
